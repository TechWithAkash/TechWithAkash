.cur{animation:cur 1.1s step-end infinite}
@keyframes cur{50%{opacity:0}}
.sc{animation:sc 7s ease-in-out infinite}
@keyframes sc{0%{transform:translateY(0);opacity:0}10%{opacity:1}70%{transform:translateY(500px);opacity:1}80%,100%{transform:translateY(500px);opacity:0}}
